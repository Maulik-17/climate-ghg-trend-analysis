# Production stack for the Climate app. IMAGE_REF is an immutable reference, normally
# ghcr.io/<owner>/<repo>@sha256:<digest>, written to .env by the VPS deploy script. Never "latest".
services:
  climate:
    image: ${IMAGE_REF:?IMAGE_REF must be set to an immutable image reference}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      maulikvect_proxy:
        aliases:
          - climate

networks:
  maulikvect_proxy:
    external: true
